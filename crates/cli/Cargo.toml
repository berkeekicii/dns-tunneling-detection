[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rules = { path = "../rules" }
features = { path = "../features" }
serde_json = "1"
collector = { path = "../collector" }
ml = { path = "../ml" }
once_cell = "1"
ort = { version = "2.0.0-rc.10", features = ["load-dynamic"] }
